[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-transcriber"
version = "0.4.0"
description = "Desktop GUI for transcribing video and audio files with faster-whisper or OpenAI Whisper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jihoon Kim" }]
dependencies = ["faster-whisper>=1.1.0"]

[project.optional-dependencies]
openai = ["openai-whisper>=20250625"]
dev = ["pytest>=8", "openai-whisper>=20250625"]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
whisper-transcriber = "whisper_transcriber.app:main"

[project.urls]
Homepage = "https://github.com/jihoonkimtech/BADA-Write"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
